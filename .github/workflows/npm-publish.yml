name: Publish npm package
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as prerelease (adds --tag next)'
        required: false
        type: boolean
        default: false
      custom_tag:
        description: 'Publish with custom dist-tag only (e.g. 2.x). Does not set latest or next.'
        required: false
        type: string

permissions:
  id-token: write  # Required for OIDC
  contents: read

env:
  rootDir: ./packages/nextjs-cache-handler
jobs:
  publish-npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.rootDir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Copy README file to package directory
        run: |
          cp ../../README.md .
          
      - uses: pnpm/action-setup@v4
      
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"
          
      - run: pnpm install --frozen-lockfile
      
      - name: Publish to npm
        run: |
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            npm publish --access public --tag ${{ github.event.inputs.custom_tag }}
          elif [ "${{ github.event.inputs.prerelease }}" == "true" ]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
